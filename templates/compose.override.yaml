# Extra per-machine settings for the dev container. Copy this file to
# .devcontainer/compose.override.yaml (gitignored) and edit. It's merged on
# top of compose.yaml: list entries like `volumes` are appended (the ai-dev
# and Claude config mounts stay), scalars like `working_dir` replace.
#
# ${HOME} is expanded by compose on the host, so it's the host user's home
# (e.g. /home/you), not the container's /home/vscode.
#
# Recreate the container after editing (VS Code: "Rebuild Container", or
# `podman compose ... up -d` again), since mounts are fixed at creation time.
services:
  dev:
    # Where `podman exec` shells (and so `claude`) start, which picks the
    # project whose memory/sessions you get by default. Leave it out for the
    # dev container repo's own (${HOME}/git/ai-dev). You can always `cd`
    # elsewhere.
    working_dir: ${HOME}/git/my-project
    volumes:
      # Mount each repo at the same absolute path it has on the host. Claude
      # Code keys memory, sessions (--resume) and per-project .claude.json
      # entries on that path, so host and container then share them. Cargo's
      # target/ also stays valid on both sides.
      # The host path must already exist (podman won't create it). :z
      # relabels for SELinux (Fedora host); use :z,ro for a read-only
      # reference checkout. Mount repos one by one rather than all of ~/git,
      # since :z relabels the whole tree.
      - ${HOME}/git/my-project:${HOME}/git/my-project:z
      # - ${HOME}/git/other-repo:${HOME}/git/other-repo:z,ro
