# Single source of truth for the dev container. Usable either way:
#   sh .devcontainer/init-host.sh && podman compose \
#     -f .devcontainer/compose.yaml -f .devcontainer/compose.override.yaml up -d
#                                            (then attach VS Code)
#   VS Code "Reopen in Container"            (then `podman exec -it ai-dev fish`)
# The fixed project name is what lets both sides find the same container:
# VS Code looks it up by the com.docker.compose.project/service labels.
# Both sides must pass the same -f files, or compose sees a config change and
# recreates the container. Put extra per-machine mounts (other git repos,
# etc.) in compose.override.yaml, not here; see
# templates/compose.override.yaml.
name: ai-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      # The container user gets the host user's name; see the Dockerfile.
      args:
        USERNAME: ${USER}
    image: localhost/ai-dev-devcontainer:latest
    container_name: ai-dev
    hostname: ai-dev
    init: true
    command: sleep infinity
    user: ${USER}
    userns_mode: keep-id:uid=1000,gid=1000
    environment:
      HOME: /home/${USER}
      # Keep .claude.json inside ~/.claude (default is ~/.claude.json) so one
      # directory mount carries all Claude Code state. Set the same on the
      # host: export CLAUDE_CONFIG_DIR="$HOME/.claude"
      CLAUDE_CONFIG_DIR: /home/${USER}/.claude
    # Default cwd for `podman exec`; compose.override.yaml can point it at a
    # mounted repo instead.
    working_dir: ${HOME}/git/ai-dev
    volumes:
      # Same absolute path as on the host (${HOME} is the host's), like every
      # other repo, so Claude Code state for this repo is shared too. Assumes
      # the clone lives at ~/git/ai-dev; init-host.sh warns if not.
      # :z relabels for SELinux (Fedora host) so the bind mount is writable.
      - ..:${HOME}/git/ai-dev:z
      # The host's Claude Code config (settings, login, sessions, per-project
      # memory, .claude.json). init-host.sh creates it if missing.
      - ${HOME}/.claude:/home/${USER}/.claude:z
      # The host's git identity/settings, read-only. The image's ~/.gitconfig
      # [include]s it and stays writable, so VS Code can still add its
      # credential helper there (and doesn't copy the host file over it).
      - ${HOME}/.gitconfig:/home/${USER}/.gitconfig.host:ro,z
      # The container's own SSH keys and known_hosts, kept across rebuilds.
      # Deliberately not the host's ~/.ssh: the container only gets keys made
      # for it. init-host.sh creates it if missing.
      - ${HOME}/.config/ai-dev/ssh:/home/${USER}/.ssh:z
